<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Офлайн — ЛЕНТА Логистика</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #004182 0%, #002B5E 100%);
      color: #fff;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 40px 32px;
      border-radius: 28px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 24px; margin-bottom: 12px; font-weight: 800; }
    p { font-size: 15px; line-height: 1.5; opacity: 0.85; margin-bottom: 24px; }
    button {
      background: #FDCB05;
      color: #001A3D;
      border: none;
      padding: 14px 28px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
      width: 100%;
    }
    button:active { transform: scale(0.96); opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Нет соединения</h1>
    <p>Проверьте интернет и попробуйте снова. Некоторые данные могут быть доступны из кэша.</p>
    <button onclick="location.reload()">Обновить страницу</button>
  </div>
</body>
</html>
