            background-size: 100% 100%, 100% 100%, 20px 20px, 20px 20px;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-panel {
            background: rgba(0, 43, 94, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(253, 203, 5, 0.3);

            border: 2px solid rgba(253, 203, 5, 0.6);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.85);
        }

        .table-container {
            max-height: calc(100vh - 270px);
            min-height: 280px;
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior-y: contain;
            padding-bottom: 120px; /* Увеличен отступ, чтобы нижняя карточка не обрезалась на телефоне */
        }
        
        thead th {
            position: sticky;
            top: 0;
            background-color: #002B5E;
            z-index: 10;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #001A3D; }
        ::-webkit-scrollbar-thumb { background: #004182; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #FDCB05; }
        
        .city-slider {
            display: flex;
            overflow-x: auto;
            overscroll-behavior-x: touch; 
            touch-action: pan-x; 
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            scroll-behavior: smooth;
        }
        .city-slider::-webkit-scrollbar { display: none; }

        .tactile-btn {
            transition: transform 0.1s ease, background-color 0.15s ease, box-shadow 0.15s ease;
        }
        .tactile-btn:active {
            transform: scale(0.93);
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-animate {
            animation: modalFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes micPulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.9); }
            70% { box-shadow: 0 0 0 16px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .mic-pulsing {
            animation: micPulse 1.4s infinite;
        }

    <script>
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        ['click', 'touchstart', 'touchend', 'touchmove', 'keydown', 'pointerdown', 'scroll', 'wheel', 'mousemove'].forEach(evt => {
            document.addEventListener(evt, () => {
                getAudioContext();
            }, { passive: true });
        });

        function playClickSound() {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                if (ctx.state === 'suspended') ctx.resume();

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(450, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.05);
                
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.05);
            } catch (e) {}
        }

        let lastScrollTickTime = 0;
        let lastScrollTop = 0;
        let accumulatedScrollDist = 0;
        
        function playTickSound(scrollSpeed = 1) {
            try {
                const now = Date.now();
                if (scrollSpeed < 0.2) return;

                accumulatedScrollDist += scrollSpeed * 12;
                const threshold = Math.max(60, Math.min(220, 220 / (scrollSpeed * 0.5)));
                
                if (accumulatedScrollDist < threshold) return;
                if (now - lastScrollTickTime < 40) return;

                accumulatedScrollDist = 0;
                lastScrollTickTime = now;
                
                const ctx = getAudioContext();
                if (!ctx) return;
                if (ctx.state === 'suspended') ctx.resume();

                const osc = ctx.createOscillator();
                const osc2 = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'square';
                osc2.type = 'sawtooth';

                osc.frequency.setValueAtTime(240, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.02);

                osc2.frequency.setValueAtTime(480, ctx.currentTime);
                osc2.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.02);
                
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.02);
                
                osc.connect(gain);
                osc2.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc2.start();
                osc.stop(ctx.currentTime + 0.02);
                osc2.stop(ctx.currentTime + 0.02);
            } catch (e) {}
        }

        function getTimeLeftHtml(timeStr) {
            if (!timeStr || timeStr === '-' || !timeStr.includes('-')) return '';
            const now = new Date();
            const currentTotalMins = now.getHours() * 60 + now.getMinutes();
            const [startStr, endStr] = timeStr.split('-');
            if (!startStr || !endStr) return '';
            
            const [startH, startM] = startStr.split(':').map(Number);
            const [endH, endM] = endStr.split(':').map(Number);
            if (isNaN(startH) || isNaN(endH)) return '';

            const startTotalMins = startH * 60 + (startM || 0);
            let endTotalMins = endH * 60 + (endM || 0);
            if (endTotalMins < startTotalMins) endTotalMins += 24 * 60; 

            if ((currentTotalMins >= startTotalMins && currentTotalMins <= endTotalMins) || 
                (startTotalMins > endTotalMins && (currentTotalMins >= startTotalMins || currentTotalMins <= endTotalMins))) {
                return `<div class="text-[10px] text-emerald-400 font-extrabold animate-pulse px-2 py-0.5 rounded-md bg-emerald-950/60 inline-flex items-center gap-1"><span>🔥</span> Разгрузка идет</div>`;
            }

            let diff = startTotalMins - currentTotalMins;
            if (diff < 0) diff += 24 * 60;

            const h = Math.floor(diff / 60);
            const m = diff % 60;

            let colorClass = 'text-blue-300';
            if (h < 4) colorClass = 'text-lentaYellow font-bold';

            return `<div class="text-[10px] ${colorClass} mt-0.5">⏱ До начала: ${h}ч ${m}м</div>`;
        }

                suggestions.slice(0, 20).forEach(store => {
                    const item = document.createElement('div');
                    item.className = 'px-3.5 py-2.5 hover:bg-lentaBlue cursor-pointer border-b border-blue-800/50 last:border-none transition-colors rounded-lg mx-1 my-0.5 text-white';
                    
                    item.innerHTML = getDropdownItemHTML(store);
                    
                    item.addEventListener('click', () => {
                        playClickSound();
                        searchInput.value = store.tk !== '-' ? store.tk : store.city; 
                        autocompleteList.classList.add('hidden');
                        renderTable();
                    });
                    
                    autocompleteList.appendChild(item);
                });
            } else {
                autocompleteList.classList.add('hidden');
            }
        });

        document.addEventListener('click', function(e) {
            if (!searchInput.contains(e.target) && !autocompleteList.contains(e.target)) {
                autocompleteList.classList.add('hidden');
            }
            if (!customFilterBtn.contains(e.target) && !customFilterList.contains(e.target)) {
                customFilterList.classList.add('hidden');
            }
        });

        window.startVoiceSearch = function() {
            const micBtn = document.getElementById('voiceSearchBtn');
            const searchInput = document.getElementById('searchInput');
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                searchInput.placeholder = "Микрофон не поддерживается";
                return;
            }
            
            try {
                const recognition = new SpeechRecognition();
                recognition.lang = 'ru-RU'; 
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;
                
                recognition.onstart = function() {
                    micBtn.classList.add('mic-pulsing', 'bg-red-600', 'border-red-400');
                    searchInput.value = '';
                    searchInput.placeholder = "Слушаю вас...";
                };
                
                recognition.onresult = function(event) {
                    const speechResult = event.results[0][0].transcript;
                    searchInput.value = speechResult.replace(/\.$/, '').trim();
                    searchInput.dispatchEvent(new Event('input'));
                };
                
                recognition.onerror = function() {
                    resetMic();
                    searchInput.placeholder = "Повторите запрос...";
                };
                
                recognition.onend = function() { 
                    resetMic(); 
                };
                
                function resetMic() {
                    micBtn.classList.remove('mic-pulsing', 'bg-red-600', 'border-red-400');
                    searchInput.placeholder = "Номер ТК, адрес, город, О'кей...";
                }
                
                recognition.start();
            } catch (e) {
                micBtn.classList.remove('mic-pulsing', 'bg-red-600', 'border-red-400');
                searchInput.placeholder = "Ошибка микрофона";
            }
        };

        setInterval(renderTable, 60000);
        renderTable();
    </script>
</body>
</html>
