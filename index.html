            const currentTotalMins = now.getHours() * 60 + now.getMinutes();

            const [startStr, endStr] = timeStr.split('-');
            if (!startStr || !endStr) return '';
            
            const [startH, startM] = startStr.split(':').map(Number);
            const [endH, endM] = endStr.split(':').map(Number);
            if (isNaN(startH) || isNaN(endH)) return '';

            const startTotalMins = startH * 60 + (startM || 0);
            let endTotalMins = endH * 60 + (endM || 0);
            if (endTotalMins < startTotalMins) endTotalMins += 24 * 60; 

            if ((currentTotalMins >= startTotalMins && currentTotalMins <= endTotalMins) || 
                (startTotalMins > endTotalMins && (currentTotalMins >= startTotalMins || currentTotalMins <= endTotalMins))) {
                return `<div class="text-xs text-emerald-400 mt-1 font-bold animate-pulse flex items-center gap-1"><span class="text-sm">🔥</span> Идёт выгрузка</div>`;
            }

            let diff = startTotalMins - currentTotalMins;
            if (diff < 0) diff += 24 * 60;

            const h = Math.floor(diff / 60);
            const m = diff % 60;

            let colorClass = 'text-slate-400';
            let icon = '⏳';
            if (h < 4) {
                colorClass = 'text-amber-400 font-bold';
                icon = '⚠️';
            }

            return `<div class="text-[10px] sm:text-xs ${colorClass} mt-1 flex items-center gap-1"><span>${icon}</span> До начала: ${h}ч ${m}м</div>`;
        }

        function renderTable() {
            const searchTerm = searchInput.value.toLowerCase().trim();
            const filterVal = filter24.value;
            
            if (searchTerm) clearSearchBtn.classList.remove('hidden');
            else clearSearchBtn.classList.add('hidden');

            tableBody.innerHTML = '';
            let count = 0;

            stores.forEach(store => {
                const matchesSearch = store.city.toLowerCase().includes(searchTerm) || 
                                      store.address.toLowerCase().includes(searchTerm) ||
                                      store.tk.toLowerCase().includes(searchTerm);
                
                let matchesFilter = true;
                if (filterVal === '24/7' && !store.is24_7) matchesFilter = false;
                if (filterVal === 'limited' && store.is24_7) matchesFilter = false;

                if (matchesSearch && matchesFilter) {
                    count++;
                    
                    let brandName = "ЛЕНТА";
                    let badgeClass = "bg-[#FFC500] text-slate-900 border-[#FFC500]";
                    let borderColor = "border-[#FFC500]/70";
                    let displayNumber = `ТК ${store.tk}`;

                    if (store.address.includes("ОКЕЙ") || store.tk === "929929") {
                        brandName = "О'КЕЙ";
                        badgeClass = "bg-red-600 text-white border-red-600 shadow-red-900/50";
                        borderColor = "border-red-600/70";
                        displayNumber = "ГИПЕРМАРКЕТ";
                    } else if (store.address.includes("Молл")) {
                        brandName = "РЦ МОЛЛ";
                        badgeClass = "bg-purple-600 text-white border-purple-600 shadow-purple-900/50";
                        borderColor = "border-purple-600/70";
                        displayNumber = "СКЛАД";
                    } else if (store.address.includes("Монетка") || store.tk.startsWith("92")) {
                        brandName = "МОНЕТКА";
                        badgeClass = "bg-orange-500 text-white border-orange-500 shadow-orange-900/50";
                        borderColor = "border-orange-500/70";
                        displayNumber = store.tk !== '-' ? `РЦ ${store.tk}` : "РЦ";
                    }

                    const is24Color = store.is24_7 ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' : 'bg-slate-700 text-slate-300 border-slate-600';
                    const is24Text = store.is24_7 ? '24/7' : `${store.start} - ${store.end}`;
                    
                    const rc1Html = store.rc1 !== '-' ? `<span class="px-2.5 py-1 bg-[#7bc47f] text-slate-900 font-bold rounded shadow-sm text-xs md:text-sm">${store.rc1}</span> ${getTimeLeftHtml(store.rc1)}` : '<span class="text-slate-600">-</span>';
                    const rc2Html = store.rc2 !== '-' ? `<span class="px-2 py-1 bg-slate-700 text-slate-200 rounded text-xs md:text-sm border border-slate-600">${store.rc2}</span>` : '<span class="text-slate-600">-</span>';

                    let cleanNavAddress = store.city + ' ' + store.address;
                    cleanNavAddress = cleanNavAddress.replace(/ООО ["']?Лента["']?,?\s*/gi, '');
                    cleanNavAddress = cleanNavAddress.replace(/ООО ОКЕЙ,?\s*/gi, '');
                    cleanNavAddress = cleanNavAddress.replace(/РЦ ["']?Монетка["']?,?\s*/gi, '');
                    cleanNavAddress = cleanNavAddress.replace(/РЦ Молл,?\s*/gi, '');
                    cleanNavAddress = cleanNavAddress.replace(/\b\d{6}\b,?\s*/g, ''); // Удаляем 6 цифр индекса
                    
                    const searchQuery = encodeURIComponent(cleanNavAddress.trim());
                    // Заменил mode=routes на простой text= для надежного срабатывания в мобильных навигаторах
                    const navLink = `https://yandex.ru/maps/?text=${searchQuery}`;

                    const cleanAddressText = store.address.replace('ООО "Лента", ', '').replace('ООО "Лента" ', '').replace('РЦ "Монетка", ', '');

                    const row = `
                        <tr class="relative flex flex-col mb-4 bg-slate-800 rounded-xl shadow-lg border-l-4 ${borderColor} md:table-row md:mb-0 md:bg-transparent md:border-0 md:border-b md:border-slate-700/50 md:rounded-none md:shadow-none hover:bg-slate-700/40 transition-colors group">
                            
                            <!-- Кнопка крестик в самой карточке (не вылетит наверх) -->
                            <button onclick="closeCard(this)" class="absolute top-3 right-3 text-slate-400 hover:text-white bg-slate-700/50 p-1.5 rounded-full z-10 transition-colors border border-slate-600 md:hidden" title="Скрыть карточку">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                            </button>

                            <td class="px-4 py-4 md:px-6 md:py-4 border-b border-slate-700/50 md:border-none md:border-l-4 md:${borderColor} flex flex-col md:table-cell pr-12 relative">
                                <button onclick="closeCard(this)" class="hidden md:block absolute top-1/2 -translate-y-1/2 right-3 text-slate-500 hover:text-white p-1 rounded-full z-10 transition-colors">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                </button>
                                <span class="md:hidden text-xs text-slate-400 font-semibold uppercase mb-2">Магазин / Рейс</span>
                                <div class="font-bold text-white flex flex-col items-start gap-1">
                                    <span class="px-2.5 py-0.5 rounded text-[10px] md:text-xs font-black tracking-wider shadow uppercase ${badgeClass}">
                                        ${brandName}
                                    </span>
                                    <span class="text-base">${displayNumber}</span>
                                </div>
                            </td>
                            <td class="px-4 py-3 md:px-6 md:py-4 border-b border-slate-700/50 md:border-none flex justify-between items-center md:table-cell">
                                <span class="md:hidden text-xs text-slate-400 font-semibold uppercase">Город</span>
                                <div class="font-bold text-[#FFC500] text-base">${store.city}</div>
                            </td>
                            <td class="px-4 py-3 md:px-6 md:py-4 border-b border-slate-700/50 md:border-none flex flex-col md:table-cell">
                                <span class="md:hidden text-xs text-slate-400 font-semibold uppercase mb-1">Адрес</span>
                                <div class="text-slate-300 text-sm whitespace-normal md:truncate md:max-w-xs lg:max-w-md leading-tight" title='${store.address}'>
                                    ${cleanAddressText}
                                </div>
                                <a href="${navLink}" target="_blank" rel="noopener noreferrer" class="mt-3 inline-flex items-center gap-1.5 px-4 py-2 bg-[#004B87]/80 hover:bg-[#004B87] border border-[#FFC500]/50 text-white rounded-lg text-xs font-bold transition-transform active:scale-95 w-fit shadow-md">
                                    <svg class="w-4 h-4 text-[#FFC500]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
                                    </svg>
                                    В навигатор
                                </a>
                            </td>
                            <td class="px-4 py-3 md:px-6 md:py-4 border-b border-slate-700/50 md:border-none flex justify-between items-center md:items-start md:flex-col md:justify-center md:table-cell">
                                <span class="md:hidden text-xs text-slate-400 font-semibold uppercase">Окно РЦ 1</span>
                                <div class="flex flex-col items-end md:items-start">${rc1Html}</div>
                            </td>
                            <td class="px-4 py-3 md:px-6 md:py-4 border-b border-slate-700/50 md:border-none flex justify-between items-center md:table-cell">
                                <span class="md:hidden text-xs text-slate-400 font-semibold uppercase">Окно РЦ 2</span>
                                <div>${rc2Html}</div>
                            </td>
                            <td class="px-4 py-4 md:px-6 md:py-4 flex justify-between items-center md:table-cell bg-slate-800/50 md:bg-transparent rounded-b-xl md:rounded-none">
                                <span class="md:hidden text-xs text-slate-400 font-semibold uppercase">Режим</span>
                                <span class="px-3 py-1.5 rounded-lg text-xs font-semibold border shadow-inner ${is24Color}">
                                    ${is24Text}
                                </span>
                            </td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                }
            });

            rowCountText.textContent = `Показано: ${count} из ${stores.length}`;
            
            if (count === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="px-6 py-12 text-center text-slate-500 block md:table-cell">По вашему запросу ничего не найдено</td></tr>`;
            }
        }

        searchInput.addEventListener('input', function() {
            renderTable(); 
            
            const searchTerm = this.value.toLowerCase().trim();
            autocompleteList.innerHTML = ''; 
            
            if (!searchTerm) {
                autocompleteList.classList.add('hidden');
                return;
            }

            const filterVal = filter24.value;
            let suggestions = stores.filter(store => {
                const matchesSearch = store.city.toLowerCase().includes(searchTerm) || 
                                      store.address.toLowerCase().includes(searchTerm) ||
                                      store.tk.toLowerCase().includes(searchTerm);
                let matchesFilter = true;
                if (filterVal === '24/7' && !store.is24_7) matchesFilter = false;
                if (filterVal === 'limited' && store.is24_7) matchesFilter = false;
                return matchesSearch && matchesFilter;
            });

            if (suggestions.length > 0) {
                autocompleteList.classList.remove('hidden');
                
                suggestions.slice(0, 20).forEach(store => {
                    const item = document.createElement('div');
                    item.className = 'px-4 py-3 hover:bg-slate-50 cursor-pointer border-b border-slate-100 last:border-none transition-colors group';
                    
                    let brandColor = "text-[#004B87]";
                    let bName = "ЛЕНТА";
                    if (store.address.includes("ОКЕЙ") || store.tk === "929929") { brandColor = "text-red-600"; bName = "О'КЕЙ"; }
                    else if (store.address.includes("Молл")) { brandColor = "text-purple-600"; bName = "МОЛЛ"; }
                    else if (store.address.includes("Монетка") || store.tk.startsWith("92")) { brandColor = "text-orange-600"; bName = "МОНЕТКА"; }
                    
                    const tkNum = store.tk !== '-' ? store.tk : bName;
                    
                    item.innerHTML = `
                        <div class="font-bold text-sm flex items-center gap-2 justify-between">
                            <span class="${brandColor} group-hover:text-black transition-colors">${store.city}</span>
                            <span class="text-[10px] bg-slate-100 border border-slate-200 text-slate-600 px-1.5 py-0.5 rounded font-bold uppercase tracking-wider">${tkNum}</span>
                        </div>
                        <div class="text-xs text-slate-500 truncate mt-1">${store.address.replace('ООО "Лента", ', '')}</div>
                    `;
                    
                    item.addEventListener('click', () => {
                        searchInput.value = store.tk !== '-' ? store.tk : store.city; 
                        autocompleteList.classList.add('hidden');
                        renderTable();
                    });
                    
                    autocompleteList.appendChild(item);
                });
            } else {
                autocompleteList.classList.add('hidden');
            }
        });

        document.addEventListener('click', function(e) {
            if (!searchInput.contains(e.target) && !autocompleteList.contains(e.target)) {
                autocompleteList.classList.add('hidden');
            }
        });

        filter24.addEventListener('change', () => {
            renderTable();
            if(searchInput.value) searchInput.dispatchEvent(new Event('input'));
        });

        setInterval(renderTable, 60000);
        renderTable();
    </script>
</body>
</html>
